<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình phát MIDI - Tối ưu cho iOS</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9; color: #333; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; margin: 0; padding: 16px;
        }
        .container {
            background-color: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 24px; width: 100%; max-width: 480px; text-align: center;
        }
        h1 { font-size: 1.4rem; margin-top: 0; margin-bottom: 8px; }
        p { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
        .step-box { margin-bottom: 15px; text-align: left; }
        .step-title { font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 5px; }
        input[type="file"] { display: none; }
        .file-label {
            display: block; background-color: #007aff; color: white; padding: 12px;
            border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer;
            text-align: center; margin-bottom: 10px;
        }
        .file-label:active { background-color: #0056b3; }
        .file-label.sf-label { background-color: #ff9500; }
        .file-label.sf-label:active { background-color: #e08400; }
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1; background-color: #e0e0e0; border: none; color: #333; padding: 12px;
            border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer;
        }
        button:disabled { opacity: 0.4; }
        #playBtn { background-color: #34c759; color: white; }
        #stopBtn { background-color: #ff3b30; color: white; }
        .status { margin-top: 20px; font-size: 0.85rem; color: #d32f2f; min-height: 2em; font-weight: 500; }
        .status.ok { color: #34c759; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trình phát MIDI iOS</h1>
        <p>Hỗ trợ tốt nhất cho tệp <b>.sf3</b> (nhẹ) và <b>.sf2</b> (dưới 20MB).</p>

        <div class="step-box">
            <div class="step-title">Bước 1: Chọn tệp âm thanh (SoundFont)</div>
            <input type="file" id="sfInput" accept=".sf2,.sf3">
            <label for="sfInput" class="file-label sf-label" id="sfLabel">Chọn tệp .sf3 hoặc .sf2</label>
        </div>

        <div class="step-box">
            <div class="step-title">Bước 2: Chọn tệp nhạc MIDI</div>
            <input type="file" id="midiFileInput" accept=".mid,.midi,audio/midi,audio/x-midi">
            <label for="midiFileInput" class="file-label" id="midiLabel">Chọn tệp .mid</label>
        </div>

        <div class="controls">
            <button id="playBtn" disabled>Phát</button>
            <button id="stopBtn" disabled>Dừng</button>
        </div>

        <div class="status" id="status">Vui lòng chọn SoundFont để bắt đầu.</div>
    </div>

    <!-- Thêm thư viện giải nén âm thanh cho iOS (Bắt buộc nếu dùng .sf3) -->
    <script src="https://unpkg.com/spessasynth_lib@4.4.7/external/stbvorbis.js"></script>

    <script type="module">
        import { Synthetizer } from 'https://unpkg.com/spessasynth_lib@4.4.7/synthetizer/synthetizer.js';
        import { Sequencer } from 'https://unpkg.com/spessasynth_lib@4.4.7/sequencer/sequencer.js';

        const sfInput = document.getElementById('sfInput');
        const sfLabel = document.getElementById('sfLabel');
        const midiFileInput = document.getElementById('midiFileInput');
        const midiLabel = document.getElementById('midiLabel');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');

        let audioContext = null;
        let synthesizer = null;
        let sequencer = null;

        function updateStatus(msg, isOk = false) {
            statusDiv.textContent = msg;
            statusDiv.className = isOk ? 'status ok' : 'status';
        }

        // Hàm đọc file tối ưu (Chia nhỏ quá trình đọc để không treo máy)
        function readFileAsArrayBuffer(file, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        onProgress(percent);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        sfInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            sfLabel.textContent = file.name;
            
            // Cảnh báo nếu file sf2 quá lớn
            if (file.name.endsWith('.sf2') && file.size > 20 * 1024 * 1024) {
                updateStatus(`Cảnh báo: Tệp SF2 quá lớn (${Math.round(file.size/1024/1024)}MB) có thể gây treo iPhone. Đang thử tải...`);
            } else {
                updateStatus(`Đang đọc SoundFont... 0%`);
            }

            try {
                const sfBuffer = await readFileAsArrayBuffer(file, (percent) => {
                    updateStatus(`Đang đọc SoundFont... ${percent}%`);
                });
                
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                updateStatus('Đang tải Worklet xử lý âm thanh...');
                await audioContext.audioWorklet.addModule('https://unpkg.com/spessasynth_lib@4.4.7/dist/spessasynth_processor.min.js');

                updateStatus('Đang phân tích cú pháp (Có thể mất 5-10s với file lớn)...');
                
                // Cho trình duyệt "thở" 100ms trước khi bắt đầu phân tích file nặng
                await new Promise(r => setTimeout(r, 100));

                synthesizer = new Synthetizer(audioContext.destination, sfBuffer);
                
                updateStatus('SoundFont đã sẵn sàng! Hãy chọn tệp MIDI.', true);
                checkReadyToPlay();

            } catch (e) {
                console.error(e);
                updateStatus('Lỗi: Không thể xử lý tệp này. Hãy thử dùng tệp .sf3 nhẹ hơn.');
            }
        });

        midiFileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            midiLabel.textContent = file.name;
            updateStatus('Đang đọc tệp MIDI...');

            try {
                const midiBuffer = await readFileAsArrayBuffer(file);
                
                if (sequencer) sequencer.stop();
                sequencer = new Sequencer(synthesizer);
                await sequencer.loadMIDI(midiBuffer);
                
                updateStatus('Đã tải xong MIDI. Bấm "Phát"!', true);
                checkReadyToPlay();

            } catch (e) {
                console.error(e);
                updateStatus('Lỗi: Tệp MIDI không hợp lệ.');
            }
        });

        function checkReadyToPlay() {
            if (synthesizer && sequencer) {
                playBtn.disabled = false;
                stopBtn.disabled = false;
            }
        }

        playBtn.addEventListener('click', async () => {
            if (audioContext && audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            if (sequencer) {
                sequencer.play();
                updateStatus('Đang phát...', true);
            }
        });

        stopBtn.addEventListener('click', () => {
            if (sequencer) {
                sequencer.stop();
                updateStatus('Đã dừng phát.', true);
            }
        });
    </script>
</body>
</html>
