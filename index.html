<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình phát MIDI Ổn định cho iPhone</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9; color: #333; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; margin: 0; padding: 16px;
        }
        .container {
            background-color: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 24px; width: 100%; max-width: 480px; text-align: center;
        }
        h1 { font-size: 1.4rem; margin-top: 0; margin-bottom: 8px; color: #1a1a1a; }
        p { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
        
        .file-input-wrapper { margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .file-label {
            display: inline-block; background-color: #007aff; color: white; padding: 12px 24px;
            border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer;
            transition: background-color 0.2s; width: 100%; text-align: center;
        }
        .file-label:active { background-color: #0056b3; }

        /* Tùy chỉnh giao diện của html-midi-player cho đẹp hơn */
        midi-player {
            width: 100%;
            margin-top: 15px;
        }
        midi-player::part(control-panel) {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
    
    <!-- Tải thư viện html-midi-player và Magenta (lõi xử lý âm thanh) -->
    <script src="https://cdn.jsdelivr.net/npm/@magenta/music@^1.23.1/es6/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-midi-player@^1.5.0/dist/html-midi-player.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Trình phát MIDI</h1>
        <p>Chọn tệp <strong>.mid</strong> để phát trực tiếp.</p>

        <div class="file-input-wrapper">
            <input type="file" id="midiFileInput" accept=".mid,.midi,audio/midi,audio/x-midi">
            <label for="midiFileInput" class="file-label" id="fileLabel">Chọn tệp MIDI</label>
        </div>

        <!-- Thẻ midi-player tự động tạo giao diện phát nhạc. Thuộc tính sound-font sẽ tự tải âm thanh chuẩn -->
        <midi-player 
            id="player" 
            sound-font 
            visualizer="#myVisualizer">
        </midi-player>

        <!-- Trình hiển thị nốt nhạc (Piano roll) - Tùy chọn -->
        <midi-visualizer type="piano-roll" id="myVisualizer"></midi-visualizer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('midiFileInput');
            const fileLabel = document.getElementById('fileLabel');
            const player = document.getElementById('player');

            fileInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                // Cập nhật tên tệp trên nút bấm
                fileLabel.textContent = file.name;

                // Tạo một đường dẫn ảo (Blob URL) từ tệp cục bộ để trình phát có thể đọc được
                const fileUrl = URL.createObjectURL(file);
                
                // Gán nguồn cho trình phát
                player.src = fileUrl;
                
                // Tự động cuộn xuống để thấy nút Play
                setTimeout(() => {
                    player.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            });
        });
    </script>
</body>
</html>
