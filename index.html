<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trình đọc thông tin IPA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f7f9fc;
    margin: 0; padding: 0;
    color: #1d1d1f;
  }
  header {
    background: linear-gradient(135deg, #007aff, #3b82f6);
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 1.3rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  header img { width: 28px; height: 28px; border-radius: 6px; }
  main {
    max-width: 720px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
  }
  
  /* Vùng kéo thả file */
  .drop-zone {
    width: 100%;
    padding: 28px 16px;
    border: 2px dashed #cbd5e1;
    border-radius: 10px;
    background: #f8fafc;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    box-sizing: border-box;
  }
  .drop-zone:hover, .drop-zone.dragging { border-color: #007aff; background: #eff6ff; }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-zone-icon { font-size: 2rem; margin-bottom: 8px; }
  .drop-zone-text { font-size: 0.95rem; color: #64748b; }
  .drop-zone-text b { color: #007aff; }

  /* Vùng nhập Link URL */
  .divider { text-align: center; margin: 20px 0; color: #94a3b8; font-size: 0.85rem; position: relative; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: #e2e8f0; }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  
  .url-input-group { display: flex; gap: 10px; }
  .url-input-group input {
    flex: 1; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    min-width: 0; 
  }
  .url-input-group input:focus { border-color: #007aff; }
  .url-input-group button {
    background: #007aff; color: white; border: none; padding: 0 20px;
    border-radius: 8px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: background 0.15s;
    white-space: nowrap;
  }
  .url-input-group button:hover { background: #0062cc; }
  .url-input-group button:disabled { background: #93c5fd; cursor: not-allowed; }

  .progress-container { width: 100%; background: #e5e7eb; border-radius: 8px; height: 8px; margin-top: 12px; overflow: hidden; display: none; }
  .progress-bar { width: 0%; height: 8px; background: linear-gradient(90deg, #60a5fa, #2563eb); transition: width 0.4s ease; }

  .result {
    margin-top: 22px;
    background: #f9fafb;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

  .result-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #f1f5f9; }
  .result-row:last-child { border-bottom: none; }
  .result-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
  .icon-blue   { background: #dbeafe; }
  .icon-green  { background: #dcfce7; }
  .icon-purple { background: #ede9fe; }
  .icon-orange { background: #ffedd5; }
  .icon-pink   { background: #fce7f3; }
  .icon-teal   { background: #ccfbf1; }
  .result-label { font-size: 0.78rem; color: #007aff; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
  .result-value { font-size: 0.97rem; font-weight: 600; color: #111827; word-break: break-all; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .copy-btn { background: none; border: none; cursor: pointer; color: #9ca3af; padding: 2px 5px; border-radius: 4px; font-size: 0.75rem; transition: color 0.15s, background 0.15s; flex-shrink: 0; }
  .copy-btn:hover { color: #007aff; background: #eff6ff; }

  /* Nút App Store */
  .btn-appstore {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #007aff;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn-appstore:hover { background: #0062cc; transform: translateY(-1px); }
  .btn-appstore:active { transform: translateY(0); }
  .btn-appstore svg { width: 13px; height: 13px; }

  .badge-notfound { font-size: 0.75rem; font-weight: 500; color: #92400e; background: #fef3c7; border-radius: 6px; padding: 2px 8px; }

  .error-box { display: none; margin-top: 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 14px 18px; color: #dc2626; font-size: 0.9rem; line-height: 1.4; }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(14px); background: #111827; color: #fff; padding: 10px 22px; border-radius: 99px; font-size: 0.85rem; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.25s; white-space: nowrap; z-index: 999;}
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { text-align: center; color: #777; margin: 20px 0; font-size: 0.9rem; }
  footer a { display: inline-block; margin-bottom: 5px; color: #007aff; text-decoration: none; font-weight: 600; }
  footer a:hover { text-decoration: underline; }

  /* Responsive cho điện thoại nhỏ */
  @media (max-width: 480px) {
    .url-input-group { flex-direction: column; }
    .url-input-group button { padding: 12px; }
  }
</style>
</head>
<body>

<header>
  <img src="https://github.com/nhut990/files/releases/download/V2.0-icon/IMG_5906.png" alt="icon">
  Trình đọc thông tin IPA
</header>

<main>
  <!-- CÁCH 1: KÉO THẢ FILE -->
  <div class="drop-zone" id="drop-zone">
    <input type="file" id="ipaFile" accept=".ipa">
    <div class="drop-zone-icon">📦</div>
    <div class="drop-zone-text">Kéo thả file IPA vào đây hoặc <b>nhấn để chọn</b></div>
  </div>

  <div class="divider">Hoặc</div>

  <!-- CÁCH 2: NHẬP LINK URL -->
  <div class="url-input-group">
    <input type="url" id="ipaUrlInput" placeholder="Dán link IPA (GitHub, v.v...)" autocomplete="off">
    <button id="btnFetchUrl" onclick="processIPAFromURL()">Đọc từ URL</button>
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result" id="result">
    <div class="result-row">
      <div class="result-icon icon-blue">📁</div>
      <div style="flex:1;min-width:0">
        <div class="result-label">Tên file</div>
        <div class="result-value"><span id="val-filename">—</span></div>
      </div>
    </div>
    <div class="result-row">
      <div class="result-icon icon-purple">🆔</div>
      <div style="flex:1;min-width:0">
        <div class="result-label">Bundle ID</div>
        <div class="result-value">
          <span id="val-bundle">—</span>
          <button class="copy-btn" onclick="copyVal('val-bundle')">📋</button>
        </div>
      </div>
    </div>
    <div class="result-row">
      <div class="result-icon icon-green">🏷️</div>
      <div style="flex:1;min-width:0">
        <div class="result-label">Tên ứng dụng</div>
        <div class="result-value">
          <span id="val-appname">—</span>
          <button class="copy-btn" onclick="copyVal('val-appname')">📋</button>
        </div>
      </div>
    </div>
    <div class="result-row">
      <div class="result-icon icon-orange">🔢</div>
      <div style="flex:1;min-width:0">
        <div class="result-label">Phiên bản</div>
        <div class="result-value">
          <span id="val-version">—</span>
          <button class="copy-btn" onclick="copyVal('val-version')">📋</button>
        </div>
      </div>
    </div>
    <div class="result-row">
      <div class="result-icon icon-pink">📱</div>
      <div style="flex:1;min-width:0">
        <div class="result-label">iOS tối thiểu</div>
        <div class="result-value">
          <span id="val-ios">—</span>
          <button class="copy-btn" onclick="copyVal('val-ios')">📋</button>
        </div>
        <div style="font-size:0.75rem;color:#94a3b8;margin-top:3px;">Yêu cầu iOS <span id="val-ios-note">—</span> trở lên để cài đặt</div>
      </div>
    </div>
    <div class="result-row">
      <div class="result-icon icon-blue">👤</div>
      <div style="flex:1;min-width:0">
        <div class="result-label">Nhà phát triển</div>
        <div class="result-value">
          <span id="val-developer">—</span>
          <button class="copy-btn" onclick="copyVal('val-developer')">📋</button>
        </div>
      </div>
    </div>
    <div class="result-row">
      <div class="result-icon icon-teal">🛒</div>
      <div style="flex:1;min-width:0">
        <div class="result-label">Item ID (App Store)</div>
        <div class="result-value">
          <span id="val-itemid">—</span>
          <button class="copy-btn" id="btn-copy-itemid" onclick="copyVal('val-itemid')" style="display:none">📋</button>
          <a class="btn-appstore" id="btn-appstore" href="#" target="_blank" style="display:none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
            </svg>
            App Store
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <a href="https://nhut990.github.io" target="_blank">Trang chủ</a><br>
  © 2025 — IPA Info Reader
</footer>

<div class="toast" id="toast">✓ Đã sao chép</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plist@3.0.6/dist/plist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bplist-parser@0.3.2/dist/bplist-parser.min.js"></script>

<script>
const dropZone  = document.getElementById('drop-zone');
const fileInput = document.getElementById('ipaFile');
const urlInput  = document.getElementById('ipaUrlInput');
const btnFetch  = document.getElementById('btnFetchUrl');

// Xử lý kéo thả file offline
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
dropZone.addEventListener('dragleave', e => { if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('dragging'); });
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (f) processIPAFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) processIPAFile(fileInput.files[0]); });

// Bắt sự kiện nhấn Enter ở ô nhập link
urlInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') processIPAFromURL();
});

// ── LUỒNG 1: ĐỌC TỪ FILE OFFLINE ──
async function processIPAFile(file) {
  showError('');
  showResult(false);
  showProgress(true);

  const fake = startFakeProgress();

  try {
    const buf = await file.arrayBuffer();
    await parseIPAData(buf, file.name);
  } catch (err) {
    handleError(err, 'Lỗi khi đọc file IPA: ');
  }
}

// ── LUỒNG 2: ĐỌC TỪ LINK URL QUA CLOUDFLARE WORKER ──
async function processIPAFromURL() {
  const ipaUrl = urlInput.value.trim();
  if (!ipaUrl) {
    showError('Vui lòng dán link IPA vào ô trống.');
    return;
  }

  showError('');
  showResult(false);
  showProgress(true);
  
  btnFetch.disabled = true;
  const fake = startFakeProgress();

  try {
    // Đã gắn sẵn link Worker hoạt động của bạn
    const proxyUrl = `https://ipa.vannhut9090.workers.dev/?url=${encodeURIComponent(ipaUrl)}`;
    const response = await fetch(proxyUrl);

    if (!response.ok) {
      throw new Error(`Máy chủ proxy trả về mã lỗi HTTP ${response.status}.`);
    }

    const buf = await response.arrayBuffer();
    let filename = ipaUrl.split('/').pop().split('?')[0] || 'Unknown.ipa';
    await parseIPAData(buf, filename);

  } catch (err) {
    if (err instanceof TypeError) {
      handleError(err, 'Lỗi mạng/CORS. Chi tiết: ');
    } else {
      handleError(err, 'Lỗi khi tải IPA từ URL: ');
    }
  } finally {
    btnFetch.disabled = false;
  }
}

// ── HÀM LÕI: XỬ LÝ DỮ LIỆU IPA (Dùng chung cho cả 2 luồng) ──
async function parseIPAData(buf, filename) {
  try {
    const zip = await JSZip.loadAsync(buf);
    const files = Object.keys(zip.files);

    // 1. Tìm Info.plist
    const infoPath = files.find(p => /^Payload\/[^/]+\.app\/Info\.plist$/i.test(p));
    if (!infoPath) throw new Error('Không tìm thấy Info.plist trong gói IPA.');
    const infoBytes = await zip.file(infoPath).async('uint8array');
    const info = await parsePlist(infoBytes);

    // 2. Tìm iTunesMetadata.plist (lấy thông tin App Store)
    let itemId = null;
    let meta = null;
    const metaPath = files.find(p => p === 'iTunesMetadata.plist');
    if (metaPath) {
      try {
        const metaBytes = await zip.file(metaPath).async('uint8array');
        meta = await parsePlist(metaBytes);
        if (meta['itemId'] !== undefined && meta['itemId'] !== null)
          itemId = String(meta['itemId']);
      } catch (_) {}
    }

    // 3. Đổ dữ liệu ra UI
    set('val-filename', filename);
    set('val-bundle',   info['CFBundleIdentifier'] || '(không có)');
    set('val-appname',  info['CFBundleDisplayName'] || info['CFBundleName'] || '(không có)');
    set('val-version',  info['CFBundleShortVersionString'] || info['CFBundleVersion'] || '(không có)');
    
    const iosVer = info['MinimumOSVersion'] || info['LSMinimumSystemVersion'] || '';
    set('val-ios',      iosVer || '(không có)');
    set('val-ios-note', iosVer || '?');
    set('val-developer', meta ? (meta['artistName'] || '(không có)') : '(không có)');

    // 4. Nút App Store
    const itemIdEl = document.getElementById('val-itemid');
    const btnCopy  = document.getElementById('btn-copy-itemid');
    const btnStore = document.getElementById('btn-appstore');

    if (itemId) {
      itemIdEl.textContent  = itemId;
      btnCopy.style.display = '';
      btnStore.href         = `https://apps.apple.com/app/id${itemId}`;
      btnStore.style.display = '';
    } else {
      itemIdEl.innerHTML    = '<span class="badge-notfound">Không có (IPA không qua App Store)</span>';
      btnCopy.style.display = 'none';
      btnStore.style.display = 'none';
    }

    // 5. Hoàn tất
    finishProgress();
    showResult(true);

  } catch (err) {
    throw err;
  }
}

/* ── PLIST PARSER LOGIC ── */
async function parsePlist(bytes) {
  const isBinary = bytes[0]===0x62 && bytes[1]===0x70 && bytes[2]===0x6c && bytes[3]===0x69;
  if (isBinary) {
    try { const r = parseBinaryPlist(bytes); if (r && typeof r==='object') return r; } catch(_){}
    try {
      if (window.bplistParser) {
        const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset+bytes.byteLength);
        const p = window.bplistParser.parseBuffer(ab);
        if (p && p[0]) return p[0];
      }
    } catch(_){}
    try { const r = plist.parse(new TextDecoder('utf-8',{fatal:false}).decode(bytes)); if(r) return r; } catch(_){}
    throw new Error('Không thể parse binary plist.');
  } else {
    try { const r = parseXMLPlist(new TextDecoder().decode(bytes)); if(r && Object.keys(r).length>0) return r; } catch(_){}
    try { return plist.parse(new TextDecoder().decode(bytes)); }
    catch(e) { throw new Error('Không thể parse XML plist: '+e.message); }
  }
}

function parseBinaryPlist(bytes) {
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const len=bytes.length, to=len-32;
  const ois=bytes[to+6], ors=bytes[to+7];
  const nObj=ri64(dv,to+8), topObj=ri64(dv,to+16), otOff=ri64(dv,to+24);
  const offs=[];
  for(let i=0;i<nObj;i++) offs.push(riN(dv,otOff+i*ois,ois));
  function rObj(idx){
    const off=offs[idx],mk=bytes[off],hi=(mk&0xF0)>>4,lo=mk&0x0F;
    if(mk===0x00)return null; if(mk===0x08)return false; if(mk===0x09)return true;
    if(hi===0x1)return riN(dv,off+1,1<<lo);
    if(hi===0x2)return lo===3?dv.getFloat64(off+1,false):dv.getFloat32(off+1,false);
    if(mk===0x33)return new Date((dv.getFloat64(off+1,false)+978307200)*1000).toISOString();
    if(hi===0x4){const[s]=ds(lo,off);return'[Data '+s+']';}
    if(hi===0x5){const[s,e]=ds(lo,off);let r='';for(let i=0;i<s;i++)r+=String.fromCharCode(bytes[off+1+e+i]);return r;}
    if(hi===0x6){const[s,e]=ds(lo,off);let r='';for(let i=0;i<s;i++)r+=String.fromCodePoint(dv.getUint16(off+1+e+i*2,false));return r;}
    if(hi===0xA){const[s,e]=ds(lo,off);const a=[];for(let i=0;i<s;i++)a.push(rObj(riN(dv,off+1+e+i*ors,ors)));return a;}
    if(hi===0xD){
      const[s,e]=ds(lo,off);const o={};
      for(let i=0;i<s;i++){const k=rObj(riN(dv,off+1+e+i*ors,ors));const v=rObj(riN(dv,off+1+e+(s+i)*ors,ors));o[k]=v;}
      return o;
    }
    return null;
  }
  function ds(lo,off){if(lo!==0x0F)return[lo,0];const is=1<<(bytes[off+1]&0x0F);return[riN(dv,off+2,is),1+is];}
  return rObj(topObj);
}
function riN(dv,off,n){let v=0;for(let i=0;i<n;i++)v=v*256+dv.getUint8(off+i);return v;}
function ri64(dv,off){return dv.getUint32(off,false)*0x100000000+dv.getUint32(off+4,false);}

function parseXMLPlist(text){const doc=new DOMParser().parseFromString(text,'application/xml');const root=doc.querySelector('plist > dict');return root?parseDict(root):{};}
function parseDict(node){const o={},c=[...node.children];for(let i=0;i<c.length;i+=2)if(c[i].tagName==='key'&&c[i+1])o[c[i].textContent]=parseNode(c[i+1]);return o;}
function parseNode(n){switch(n.tagName){case'string':return n.textContent;case'integer':return parseInt(n.textContent,10);case'real':return parseFloat(n.textContent);case'true':return true;case'false':return false;case'dict':return parseDict(n);case'array':return[...n.children].map(parseNode);default:return n.textContent;}}

/* ── UI HELPERS & TRẠNG THÁI ── */
let progressInterval = null;

function startFakeProgress() {
  let progress = 0;
  setProgress(0);
  progressInterval = setInterval(() => {
    if (progress < 88) { progress += 5; setProgress(progress); }
  }, 150);
  return progressInterval;
}

function finishProgress() {
  clearInterval(progressInterval);
  setProgress(100);
  setTimeout(() => { showProgress(false); setProgress(0); }, 400);
}

function handleError(err, prefix) {
  clearInterval(progressInterval); 
  setProgress(0);
  setTimeout(() => showProgress(false), 300);
  showError('❌ ' + prefix + (err.message || err));
}

function set(id,val){document.getElementById(id).textContent=val;}
function showProgress(on){document.getElementById('progressContainer').style.display=on?'block':'none';}
function setProgress(v){document.getElementById('progressBar').style.width=v+'%';}
function showResult(on){document.getElementById('result').style.display=on?'block':'none';}
function showError(msg){const eb=document.getElementById('errorBox');eb.textContent=msg;eb.style.display=msg?'block':'none';}
function copyVal(id){
  const textToCopy = document.getElementById(id).textContent;
  navigator.clipboard.writeText(textToCopy).then(()=>{
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),1800);
  }).catch(() => {
    alert('Không thể sao chép. Vui lòng copy thủ công.');
  });
}
</script>
</body>
</html>
