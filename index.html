<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình phát MIDI - HTML Midi Player</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9; color: #333; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; margin: 0; padding: 16px;
        }
        .container {
            background-color: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 24px; width: 100%; max-width: 480px; text-align: center;
        }
        h1 { font-size: 1.4rem; margin-top: 0; margin-bottom: 8px; color: #1a1a1a; }
        p { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
        
        .file-input-wrapper { margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .file-label {
            display: inline-block; background-color: #007aff; color: white; padding: 12px 24px;
            border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer;
            transition: background-color 0.2s; width: 100%; text-align: center;
        }
        .file-label:active { background-color: #0056b3; }

        /* CSS cho thẻ midi-player và midi-visualizer */
        midi-player {
            width: 100%;
            display: block;
            margin-top: 15px;
        }

        midi-visualizer {
            display: block;
            width: 100%;
            height: 150px;
            margin-top: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trình phát MIDI</h1>
        <p>Chọn tệp <strong>.mid</strong> để phát.</p>

        <div class="file-input-wrapper">
            <input type="file" id="midiFileInput" accept=".mid,.midi,audio/midi,audio/x-midi">
            <label for="midiFileInput" class="file-label" id="fileLabel">Chọn tệp MIDI</label>
        </div>

        <!-- Thẻ phát nhạc -->
        <midi-player id="player" sound-font></midi-player>

        <!-- Trình hiển thị nốt nhạc -->
        <midi-visualizer type="piano-roll" id="myVisualizer"></midi-visualizer>
    </div>

    <!-- Tải thư viện qua unpkg để tránh bị chặn mạng (Viettel) -->
    <script src="https://unpkg.com/@magenta/music@^1.23.1/es6/core.js"></script>
    <script src="https://unpkg.com/html-midi-player@^1.5.0/dist/html-midi-player.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('midiFileInput');
            const fileLabel = document.getElementById('fileLabel');
            const player = document.getElementById('player');
            const visualizer = document.getElementById('myVisualizer');

            fileInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                // Hiển thị tên tệp
                fileLabel.textContent = file.name;

                // Tạo URL từ file cục bộ
                const fileUrl = URL.createObjectURL(file);
                
                // Kết nối visualizer với player (quan trọng để hiển thị nốt nhạc)
                player.visualizer = visualizer;
                
                // Gán nguồn phát
                player.src = fileUrl;
            });
        });
    </script>
</body>
</html>
