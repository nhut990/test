<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình phát MIDI với SpessaSynth</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 650px;
            margin: 20px auto;
            padding: 15px;
        }
        h2 {
            font-size: 20px;
        }
        .nhom {
            margin-bottom: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="file"] {
            display: block;
            margin-bottom: 10px;
            width: 100%;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f8f8f8;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #trangThai {
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <h2>Trình phát MIDI + SoundFont (.sf2)</h2>

    <div class="nhom">
        <label>1. Nạp SoundFont từ máy (.sf2 / .sf3 / .dls)</label>
        <!-- Thêm application/octet-stream để iOS cho phép chọn file -->
        <input type="file" id="sf2Input" accept="application/octet-stream,.sf2,.sf3,.sfogg,.dls">
    </div>

    <div class="nhom">
        <label>2. Nạp file MIDI (.mid)</label>
        <input type="file" id="midiInput" accept="application/octet-stream,.mid,.rmi,.xmf,.mxmf">
    </div>

    <div class="nhom">
        <label>3. Điều khiển</label>
        <button id="playBtn" disabled>Phát</button>
        <button id="stopBtn" disabled>Dừng</button>
    </div>

    <div id="trangThai">Đang chờ nạp file...</div>

    <script type="module">
        import {
            WorkletSynthesizer,
            Sequencer
        } from 'https://cdn.jsdelivr.net/npm/spessasynth_lib@4.4.0/dist/spessasynth_lib.min.js';

        const WORKLET_URL =
            'https://cdn.jsdelivr.net/npm/spessasynth_lib@4.4.0/dist/spessasynth_processor.min.js';

        let audioContext = null;
        let synthesizer = null;
        let sequencer = null;

        const sf2Input = document.getElementById('sf2Input');
        const midiInput = document.getElementById('midiInput');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const trangThai = document.getElementById('trangThai');

        function capNhatTrangThai(msg) {
            trangThai.innerText = msg;
        }

        function kiemTraSanSang() {
            if (synthesizer && sequencer) {
                playBtn.disabled = false;
                stopBtn.disabled = false;
            } else {
                playBtn.disabled = true;
                stopBtn.disabled = true;
            }
        }

        // ===== Nạp SoundFont =====
        sf2Input.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Kiểm tra đuôi file thủ công (quan trọng cho iOS)
            const allowedExts = ['.sf2', '.sf3', '.sfogg', '.dls'];
            const fileName = file.name.toLowerCase();
            const isValid = allowedExts.some(ext => fileName.endsWith(ext));

            if (!isValid) {
                alert('Vui lòng chọn file SoundFont hợp lệ (.sf2, .sf3, .sfogg, .dls)');
                e.target.value = '';
                return;
            }

            try {
                capNhatTrangThai('Đang đọc file SoundFont...');
                const arrayBuffer = await file.arrayBuffer();

                // Tạo AudioContext nếu chưa có (phải do thao tác người dùng kích hoạt)
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    await audioContext.audioWorklet.addModule(WORKLET_URL);
                }

                // Resume AudioContext ngay (iOS yêu cầu)
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // Dừng sequencer cũ
                if (sequencer) {
                    try { sequencer.stop(); } catch (_) {}
                    sequencer = null;
                }

                // Ngắt synthesizer cũ
                if (synthesizer) {
                    try { synthesizer.disconnect(); } catch (_) {}
                }

                // Tạo synthesizer mới
                synthesizer = new WorkletSynthesizer(audioContext);

                // Nạp SoundFont
                await synthesizer.soundBankManager.addSoundBank(arrayBuffer, 'main');

                if (synthesizer.isReady) {
                    await synthesizer.isReady;
                }

                synthesizer.connect(audioContext.destination);

                capNhatTrangThai(`Đã nạp SoundFont: ${file.name}`);
                kiemTraSanSang();
            } catch (err) {
                console.error(err);
                capNhatTrangThai('Lỗi khi nạp SoundFont: ' + err.message);
            }
        });

        // ===== Nạp file MIDI =====
        midiInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Kiểm tra đuôi file
            const allowedExts = ['.mid', '.rmi', '.xmf', '.mxmf'];
            const fileName = file.name.toLowerCase();
            const isValid = allowedExts.some(ext => fileName.endsWith(ext));

            if (!isValid) {
                alert('Vui lòng chọn file MIDI hợp lệ (.mid, .rmi, .xmf, .mxmf)');
                e.target.value = '';
                return;
            }

            if (!synthesizer) {
                capNhatTrangThai('Vui lòng nạp SoundFont (.sf2) trước.');
                return;
            }

            try {
                capNhatTrangThai('Đang đọc file MIDI...');
                const arrayBuffer = await file.arrayBuffer();

                if (sequencer) {
                    try { sequencer.stop(); } catch (_) {}
                }

                sequencer = new Sequencer(synthesizer);
                await sequencer.loadNewMIDI(arrayBuffer);

                const thoiLuong =
                    sequencer.duration !== undefined
                        ? ` - Thời lượng: ${sequencer.duration.toFixed(1)} giây`
                        : '';

                capNhatTrangThai(`Đã nạp MIDI: ${file.name}${thoiLuong}`);
                kiemTraSanSang();
            } catch (err) {
                console.error(err);
                capNhatTrangThai('Lỗi khi nạp MIDI: ' + err.message);
            }
        });

        // ===== Phát =====
        playBtn.addEventListener('click', async () => {
            if (!sequencer) return;

            try {
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                sequencer.play();
                capNhatTrangThai('Đang phát MIDI...');
            } catch (err) {
                console.error(err);
                capNhatTrangThai('Lỗi khi phát: ' + err.message);
            }
        });

        // ===== Dừng =====
        stopBtn.addEventListener('click', () => {
            if (!sequencer) return;
            try {
                sequencer.stop();
                sequencer.currentTime = 0;
            } catch (_) {}
            capNhatTrangThai('Đã dừng.');
        });
    </script>
</body>
</html>
