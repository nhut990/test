<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình phát MIDI với SpessaSynth</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        #status { margin: 1rem 0; padding: 0.5rem; border-radius: 4px; background: #f0f0f0; }
        .controls { margin-top: 1rem; display: flex; gap: 1rem; align-items: center; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🎵 Trình phát MIDI (SpessaSynth)</h2>
    <p id="status">Đang tải SoundFont, vui lòng đợi...</p>

    <input type="file" id="midi_input" accept=".mid, .rmi, .xmf" disabled>
    
    <div class="controls">
        <button id="play_btn" disabled>▶ Phát</button>
        <button id="stop_btn" disabled>⏹ Dừng</button>
    </div>

    <script type="module">
        // 1. Import các lớp cần thiết từ CDN của thư viện
        import { WorkletSynthesizer, Sequencer } from 'https://cdn.jsdelivr.net/npm/spessasynth_lib@4/+esm';

        // 2. Cấu hình đường dẫn
        const WORKLET_URL = 'https://github.com/nhut990/midi/raw/refs/heads/main/spessasynth_processor.min.js';
        // Sử dụng một SoundFont công cộng (GeneralUserGS) để có âm thanh
        const SOUNDFONT_URL = 'https://cdn.jsdelivr.net/gh/musescore/MuseScore@master/share/sound/FluidR3Mono_GM.sf3';

        // 3. Lấy các phần tử DOM
        const statusEl = document.getElementById('status');
        const midiInput = document.getElementById('midi_input');
        const playBtn = document.getElementById('play_btn');
        const stopBtn = document.getElementById('stop_btn');

        let synth, sequencer, audioContext;

        // 4. Hàm khởi tạo chính
        async function init() {
            try {
                // Tải SoundFont
                statusEl.textContent = 'Đang tải SoundFont...';
                const sfResponse = await fetch(SOUNDFONT_URL);
                if (!sfResponse.ok) throw new Error('Không thể tải SoundFont.');
                const sfBuffer = await sfResponse.arrayBuffer();

                // Tạo AudioContext và tải AudioWorklet
                statusEl.textContent = 'Đang khởi tạo Audio Engine...';
                audioContext = new AudioContext({ sampleRate: 44100 });
                await audioContext.audioWorklet.addModule(WORKLET_URL);

                // Khởi tạo Synthesizer
                synth = new WorkletSynthesizer(audioContext);
                await synth.soundBankManager.addSoundBank(sfBuffer, "main");

                // Khởi tạo Sequencer và kết nối với Synthesizer
                sequencer = new Sequencer(synth);
                
                // Cập nhật giao diện
                statusEl.textContent = 'Sẵn sàng! Hãy chọn một tệp MIDI.';
                midiInput.disabled = false;
                playBtn.disabled = false;
                stopBtn.disabled = false;

            } catch (error) {
                console.error(error);
                statusEl.textContent = `Lỗi khởi tạo: ${error.message}`;
            }
        }

        // 5. Xử lý sự kiện khi người dùng chọn tệp MIDI
        midiInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            try {
                statusEl.textContent = 'Đang tải tệp MIDI...';
                const midiBuffer = await file.arrayBuffer();
                
                // Nạp tệp MIDI vào sequencer
                await sequencer.loadNewSongList([midiBuffer]);
                statusEl.textContent = `Đã tải: ${file.name}. Nhấn "Phát" để nghe.`;

            } catch (error) {
                console.error(error);
                statusEl.textContent = `Lỗi khi tải tệp MIDI: ${error.message}`;
            }
        });

        // 6. Xử lý nút Phát
        playBtn.addEventListener('click', async () => {
            if (audioContext.state === 'suspended') {
                await audioContext.resume(); // Yêu cầu của trình duyệt
            }
            sequencer.play();
            statusEl.textContent = 'Đang phát...';
        });

        // 7. Xử lý nút Dừng
        stopBtn.addEventListener('click', () => {
            sequencer.stop();
            statusEl.textContent = 'Đã dừng.';
        });

        // Khởi chạy
        init();
    </script>
</body>
</html>
