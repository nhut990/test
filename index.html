<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình phát MIDI với SpessaSynth</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        #status { margin: 1rem 0; padding: 0.75rem; border-radius: 6px; background: #f0f2f5; color: #333; font-size: 0.95rem; }
        #status.error { background: #ffebee; color: #c62828; }
        .controls { margin-top: 1.5rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        button { padding: 0.65rem 1.2rem; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; background: #007aff; color: white; transition: opacity 0.2s; }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }
        button#stop_btn { background: #ff3b30; }
        button:active:not(:disabled) { opacity: 0.8; }
        input[type="file"] { font-size: 0.95rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h2>🎵 Trình phát MIDI (SpessaSynth)</h2>
    <p id="status">Đang khởi tạo Audio Engine và tải SoundFont...</p>

    <input type="file" id="midi_input" accept=".mid, .midi, .rmi, .xmf" disabled>
    
    <div class="controls">
        <button id="play_btn" disabled>▶ Phát</button>
        <button id="stop_btn" disabled>⏹ Dừng</button>
    </div>

    <!-- BẮT BUỘC: Tải stbvorbis_asm.js để giải mã âm thanh trên iOS Safari -->
    <script src="https://cdn.jsdelivr.net/npm/spessasynth_lib@4/dist/utils/stbvorbis_asm.js"></script>

    <script type="module">
        import { WorkletSynthesizer, Sequencer } from 'https://cdn.jsdelivr.net/npm/spessasynth_lib@4/+esm';

        const WORKLET_URL = 'https://cdn.jsdelivr.net/npm/spessasynth_lib@4/dist/spessasynth_processor.min.js';
        const SOUNDFONT_URL = 'https://cdn.jsdelivr.net/npm/generaluser@1.47.1/GeneralUser.sf2';

        const statusEl = document.getElementById('status');
        const midiInput = document.getElementById('midi_input');
        const playBtn = document.getElementById('play_btn');
        const stopBtn = document.getElementById('stop_btn');

        let synth, sequencer, audioContext;
        let isInitialized = false;

        function updateStatus(msg, isError = false) {
            statusEl.textContent = msg;
            statusEl.className = isError ? 'error' : '';
        }

        async function init() {
            try {
                updateStatus('Đang tải SoundFont...');
                const sfResponse = await fetch(SOUNDFONT_URL);
                if (!sfResponse.ok) throw new Error(`Không thể tải SoundFont (HTTP ${sfResponse.status}).`);
                const sfBuffer = await sfResponse.arrayBuffer();

                updateStatus('Đang khởi tạo Audio Engine...');
                // ⭐️ Không ép buộc sampleRate để tránh lỗi xung đột phần cứng trên iOS
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                await audioContext.audioWorklet.addModule(WORKLET_URL);

                synth = new WorkletSynthesizer(audioContext);
                await synth.soundBankManager.addSoundBank(sfBuffer, "main");

                // Kết nối đầu ra của synth với loa
                synth.connect(audioContext.destination);

                sequencer = new Sequencer(synth);
                
                isInitialized = true;
                updateStatus('Sẵn sàng! Hãy chọn một tệp MIDI.');
                midiInput.disabled = false;
                playBtn.disabled = false;
                stopBtn.disabled = false;

            } catch (error) {
                console.error("Lỗi khởi tạo:", error);
                updateStatus(`Lỗi khởi tạo: ${error.message}`, true);
            }
        }

        midiInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file || !isInitialized) return;

            try {
                updateStatus('Đang tải tệp MIDI...');
                const midiBuffer = await file.arrayBuffer();
                await sequencer.loadNewSongList([midiBuffer]);
                updateStatus(`Đã tải: ${file.name}. Nhấn "Phát" để nghe.`);
            } catch (error) {
                console.error("Lỗi tải MIDI:", error);
                updateStatus(`Lỗi khi tải tệp MIDI: ${error.message}`, true);
            }
        });

        playBtn.addEventListener('click', async () => {
            try {
                // 1. Kích hoạt phiên âm thanh Playback cho iOS 17+
                if (navigator.audioSession) {
                    try {
                        if (navigator.audioSession.type !== "playback") {
                            navigator.audioSession.type = "playback";
                        }
                    } catch (e) {
                        console.warn("Không thể thiết lập AudioSession:", e);
                    }
                }

                // 2. Resume AudioContext
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // 3. Đánh thức AudioWorklet bằng một xung âm thanh thực tế (không phải silence)
                const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.1, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    // Tạo một tần số cực nhỏ, biên độ thấp để không gây tiếng ồn nhưng đủ đánh thức iOS
                    data[i] = Math.sin(i * 0.1) * 0.001; 
                }
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);

                // 4. Đợi phần cứng âm thanh khởi động
                await new Promise(resolve => setTimeout(resolve, 150));

                // 5. Phát nhạc
                sequencer.play();
                updateStatus('Đang phát...');
            } catch (error) {
                console.error("Lỗi phát nhạc:", error);
                updateStatus(`Lỗi khi phát: ${error.message}`, true);
            }
        });

        stopBtn.addEventListener('click', () => {
            if (sequencer) {
                sequencer.stop();
                updateStatus('Đã dừng.');
            }
        });

        init();
    </script>
</body>
</html>
